name: pr-validation
on:
    pull_request:
        branches:
            - develop
jobs:
    linting-job:
        runs-on: ubuntu-latest
        steps:
            -   name: checkout repo
                uses: actions/checkout@v4
            -   name: Lint HTML and CSS
                run: |
                    npx htmlhint "**/*.html"
                    npx htmlhint "**/*.css"
    build-job:
        runs-on: ubuntu-latest
        steps:
            -   name: checkout repo
                uses: actions/checkout@v4
            -   name: Build with Parcel
                run: |
                    npx parcel build "./src/*.html" --dist-dir "./dev" --public-url "./"


